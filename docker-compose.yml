services:
  db:
    image: postgres:16-alpine
    environment:
      # Set these in your shell or an untracked local environment file.
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB locally}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER locally}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
    ports:
      - "5432:5432"
    volumes:
      - netrajyoti_pgdata:/var/lib/postgresql/data
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - netrajyoti_ollama:/root/.ollama

volumes:
  netrajyoti_pgdata:
  netrajyoti_ollama:
