spring:
  application:
    name: netrajyoti-api
  datasource:
    # Supplied only through the local environment or a deployment secret store.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
server:
  error:
    include-message: never
netrajyoti:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  ai-summary:
    enabled: ${AI_SUMMARY_ENABLED:false}
    # Demo-only switch. When true, Ollama may retrieve records explicitly
    # marked DEMO_SIMULATED_NOT_FOR_CLINICAL_USE. It never changes routing.
    demo-rag-enabled: ${DEMO_RAG_ENABLED:false}
    # Ollama runs locally by default. Do not send patient details, voice, or
    # free text to this endpoint.
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2:3b}
    # PostgreSQL retrieval is restricted to clinician-approved records, except
    # when the explicit demo-only switch above is enabled.
