spring:
  application:
    name: netrajyoti-api
  datasource:
    # Supplied only through the local environment or a deployment secret store.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
server:
  error:
    include-message: never
netrajyoti:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  ai-summary:
    enabled: ${AI_SUMMARY_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-sol}
